<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --ink:#1C2419; --sub:#56604F; --line:#DDE1D5;
  --green:#2F5E2B; --green-soft:#E3EBDD; --mustard:#E7B04A; --mustard-soft:#FBEFD2; --on-green:#FFFFFF;
  --radius:14px;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141A13; --surface:#1D251C; --ink:#E8ECE3; --sub:#A3AD9B; --line:#2E392C;
    --green:#8DBF7F; --green-soft:#24331F; --mustard:#E7B04A; --mustard-soft:#3A3020; --on-green:#10170F; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;border-radius:6px}

/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.08em;margin:0;flex:1;white-space:nowrap}
.wake{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px;cursor:pointer}
.wake .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wake[aria-pressed="true"]{border-color:var(--green);color:var(--green)}
.wake[aria-pressed="true"] .dot{background:var(--green)}
.search{max-width:720px;margin:10px auto 0;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 40px 10px 38px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--sub)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  width:36px;height:36px;color:var(--sub);cursor:pointer;display:none;font-size:20px;line-height:1}
.search.has .clear{display:block}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:6px auto 0;
  scroll-snap-type:x proximity}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 12px 11px;font-size:15px;color:var(--sub);cursor:pointer;
  border-bottom:3px solid transparent;scroll-snap-align:start;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
.tab.ref{margin-left:auto}

main{max-width:720px;margin:0 auto;padding:16px}

/* tag filter */
.tags-label{display:block;font-size:12px;color:var(--sub);letter-spacing:.06em;margin:0 0 4px}
.tags{display:flex;gap:6px;margin:0 -16px 14px;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;
  cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}

.intro{color:var(--sub);font-size:15px;margin:0 0 14px}
.intro p{margin:0 0 8px}
.intro ul{margin:0 0 8px;padding-left:1.2em}

/* cards */
.card{scroll-margin-top:180px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 10px;overflow:hidden}
.card>button.head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  padding:14px 16px;cursor:pointer;min-height:56px}
.head .title{flex:1;font-weight:600;font-size:17px;line-height:1.45}
.head .cat{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.time{flex:none;font-size:13px;font-variant-numeric:tabular-nums;color:var(--green);background:var(--green-soft);
  border-radius:999px;padding:2px 10px}
.badge{flex:none;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chev{flex:none;width:18px;height:18px;stroke:var(--sub);transition:transform .2s ease}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 16px 16px;border-top:1px dashed var(--line)}
.card.open .body{display:block}
.body p{margin:12px 0 0}
.body ul,.body ol{margin:12px 0 0;padding-left:1.4em}
.body li{margin:4px 0}
.body ol li::marker{color:var(--green);font-weight:700}
.body .lead{font-size:15px;color:var(--sub)}

/* signature: 分量・時間のマーカー */
.q{background:linear-gradient(transparent 58%,var(--mustard-soft) 58%);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 1px}
@media (prefers-color-scheme: dark){ .q{background:linear-gradient(transparent 55%,var(--mustard-soft) 55%);color:#F3D9A0} }

table{border-collapse:collapse;width:100%;margin:12px 0 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:600}
.tablewrap{overflow-x:auto}

.empty{text-align:center;color:var(--sub);padding:40px 0}
footer{max-width:720px;margin:24px auto 0;padding:0 16px;font-size:12px;color:var(--sub);text-align:center}
a{color:var(--green)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

<script>
const DATA = {"source_updated":"2026-10-31","built":"2026-10-31","tags":["豚こま","鶏むね","ツナ","サバ缶","鮭","シーフード","にんじん","玉ねぎ","長ねぎ","ほうれん草","ブロッコリー","ピーマン","茄子","豆腐","油揚げ","切り干し大根","トマト缶","うどん","パスタ","わかめ","じゃがいも"],"categories":[{"id":"gohan","name":"白米のおかず","short":"ごはん","reference":false,"intro":[],"recipes":[{"id":"gohan-1","title":"豚こまとにんじんのめんつゆ蒸し煮","time":"15分","badges":[],"tags":["豚こま","にんじん","玉ねぎ","長ねぎ","ほうれん草"],"blocks":[{"t":"p","text":"豚もやし酒蒸しと同じ技術。蓋をして蒸すだけ。"},{"t":"p","text":"にんじん1/2本を薄い半月切り、玉ねぎ1/4個を薄切りにしてフライパンに敷く。豚こま100gを広げて乗せる。水50ml・めんつゆ（3倍濃縮）大さじ1.5・みりん大さじ1/2を回しかけ、蓋をして中火8分。蓋を開けて冷凍ほうれん草をひとつかみ入れ、水分を飛ばしながら1〜2分。"},{"t":"p","text":"薄切りにすればにんじんは8分で十分やわらかくなる。厚いと芯が残るのでそこだけ注意。"}]},{"id":"gohan-2","title":"鶏むねの照り焼き","time":"15分","badges":[],"tags":["鶏むね","ブロッコリー"],"blocks":[{"t":"p","text":"鶏むね1枚を1.5cm厚のそぎ切りにし、塩ひとつまみと片栗粉を薄くまぶす。油を熱したフライパンで両面3分ずつ焼く。醤油・みりん・酒・砂糖を各大さじ1混ぜて回し入れ、とろみがつくまで1分煮からめる。"},{"t":"p","text":"片栗粉がむね肉のパサつきを防ぎ、同時にタレをからめる役割も果たす。冷凍ブロッコリーをレンジで解凍して添えると緑が入る。"}]},{"id":"gohan-3","title":"サバ缶と玉ねぎの味噌煮","time":"10分","badges":[],"tags":["サバ缶","玉ねぎ","長ねぎ"],"blocks":[{"t":"p","text":"玉ねぎ1/2個を薄切りにしてフライパンで2分炒める。サバ水煮缶を汁ごと加え、味噌大さじ1・みりん大さじ1・砂糖小さじ1を溶き入れて5分煮る。長ねぎを散らす。"},{"t":"p","text":"火が通った魚の缶詰なので煮崩す前提で扱ってよい。生魚を扱わずに青魚が取れる。"}]},{"id":"gohan-4","title":"ツナにんじんしりしり","time":"10分","badges":["卵なし"],"tags":["ツナ","にんじん"],"blocks":[{"t":"p","text":"にんじん1本を細切り（ピーラーで薄く削いでから刻むと楽）。ごま油で3分炒め、ツナ缶を油ごと加える。めんつゆ大さじ1と砂糖ひとつまみで味を整える。"},{"t":"p","text":"冷蔵3〜4日もつ常備菜。多めに作って翌日の弁当や酒のつまみにまわせる。"}]},{"id":"gohan-5","title":"豚こまとピーマンのオイスター炒め","time":"10分","badges":[],"tags":["豚こま","玉ねぎ","長ねぎ","ピーマン"],"blocks":[{"t":"p","text":"豚こま100gを炒め、色が変わったらピーマン2個の細切りと玉ねぎを加える。オイスターソース大さじ1・醤油小さじ1・砂糖ひとつまみ。"},{"t":"p","text":"野菜炒めの味付けをオイスターに振り替えただけ。既存レパートリーの横展開。"}]},{"id":"gohan-6","title":"切り干し大根の煮物","time":"20分","badges":["常備菜"],"tags":["にんじん","油揚げ","切り干し大根"],"blocks":[{"t":"p","text":"切り干し大根20gを水で5分戻す（戻し汁は捨てない）。にんじん細切り・油揚げ細切りと一緒に鍋へ入れ、戻し汁200ml・めんつゆ大さじ2・みりん大さじ1で15分煮る。"},{"t":"p","text":"冷蔵4〜5日、冷凍も可。乾物なので買い置きが効き、食物繊維とカルシウムの補充になる。"}]},{"id":"gohan-7","title":"おばけカレー","time":"30分","badges":[],"tags":["豚こま","にんじん","玉ねぎ","長ねぎ","ブロッコリー"],"blocks":[{"t":"p","text":"ハロウィン用。かぼちゃカレーのご飯をおばけの形にするだけ。30分は炊飯を除いた時間。"},{"t":"p","text":"材料（2人前）：米1.5合（炊き上がり約500g、1皿約250g）、豚こま100g、玉ねぎ1/2個、にんじん1/2本、冷凍かぼちゃ100g、カレールー2皿分（水は箱の表示どおり）、焼きのり、油少々。"},{"t":"ol","items":["米1.5合を炊く。","玉ねぎを薄切り、にんじんを薄い半月切りにし、豚こまと一緒に油で炒める。","箱の表示どおりに2皿分の水を入れ、蓋をして10分煮る。","冷凍かぼちゃを凍ったまま入れて5分煮る。","火を止めてルーを溶かし、弱火で5分煮る。","ご飯を2等分し、ラップでおばけの形に整えてカレーにのせ、のりを切って目と口を付ける。"]},{"t":"p","text":"かぼちゃは崩れやすいので後半に入れる。少量だと煮詰まりやすいので、水が減ったら足す。冷凍ブロッコリーをレンジで解凍して添えると緑が入る。"}]}]},{"id":"tori","name":"鶏むね肉","short":"鶏むね","reference":false,"intro":[{"t":"p","text":"1枚（250〜360g）= 1回分 = 2食分で考える。弱点はパサつきだけで、対策は3つ。"},{"t":"ul","items":["片栗粉をまぶす（衣が水分の逃げ道を塞ぐ）","塩と砂糖で下味をつける（砂糖は甘みではなく保水のため）","余熱で火を通す（沸騰させ続けない）"]},{"t":"p","text":"鶏肉の生焼けは食中毒の原因になる。一番厚いところを切り、中心が白く肉汁が透明なら完成。ピンクが残れば追加で加熱する。"}],"recipes":[{"id":"tori-1","title":"照り焼きの補足","time":null,"badges":["白米のおかず2番"],"tags":["にんじん","玉ねぎ","長ねぎ","ほうれん草"],"blocks":[{"t":"ul","items":["1.5cm厚のそぎ切りにして厚みを揃える。片栗粉をまぶしたらすぐ焼く。","並べたら3分動かさない。タレは焼く前に混ぜておき、弱火に落としてから入れる（砂糖とみりんが焦げる）。","泡が大きくゆっくりになり、とろみがついたら火を止める。少しゆるい段階で止めてよい。","359gの1枚なら、片栗粉大さじ1.5、醤油・みりん各大さじ1.5、酒大さじ1、砂糖小さじ1.5。","野菜（にんじん・玉ねぎ・ほうれん草）を入れるなら、焼いた肉を一度取り出し、にんじんと玉ねぎを4分炒め、レンジ解凍して水気を絞ったほうれん草を加え、肉を戻してからタレを入れる。","残りはタレごと冷蔵2日。レンジで温め直すときは20秒ずつ。"]}]},{"id":"tori-2","title":"茹で鶏","time":null,"badges":["サラダチキン","作り置き"],"tags":["鶏むね","うどん"],"blocks":[{"t":"p","text":"むね肉1枚に塩小さじ1/2と砂糖小さじ1/2をすり込み10分置く。鍋に肉がかぶる量の水と酒大さじ1を沸かし、肉を入れてすぐ火を止め、蓋をして30分放置。薄くそぎ切りにする。"},{"t":"p","text":"火加減の管理が要らないので、丸ごと調理では一番失敗しにくい。茹で汁は鶏の出汁が出ているので、味噌汁やうどんのつゆに使う。冷蔵3日、冷凍3週間（茹で汁ごと小分けすると乾かない）。"}]},{"id":"tori-3","title":"ねぎ塩だれ","time":null,"badges":[],"tags":["鶏むね","長ねぎ"],"blocks":[{"t":"p","text":"小口切りの長ねぎ大さじ3（冷凍のままで可）、ごま油大さじ1、塩小さじ1/3、酢少々を混ぜる。茹で鶏にも焼いた肉にも合う。冷蔵1週間。"}]},{"id":"tori-4","title":"鶏むねとピーマンのオイスター炒め","time":null,"badges":[],"tags":["鶏むね","玉ねぎ","長ねぎ","ピーマン","茄子"],"blocks":[{"t":"p","text":"むね肉を1cm幅の細切りにし、酒大さじ1と片栗粉小さじ2をまぶす。油で2分炒めて一度取り出す。ピーマン2個の細切りと玉ねぎ1/4個を1分炒め、肉を戻してオイスターソース大さじ1・醤油小さじ1・砂糖ひとつまみ。"},{"t":"p","text":"肉を一度取り出すのが要点。ピーマンは茄子に置き換えられる。"}]},{"id":"tori-5","title":"鶏むねの唐揚げ風","time":null,"badges":["揚げ焼き"],"tags":["鶏むね"],"blocks":[{"t":"p","text":"一口大に切り、醤油大さじ1・酒大さじ1・にんにく少々・砂糖ひとつまみで10分漬ける。汁気を切って片栗粉をまぶし、深さ5mmの油で片面3分ずつ揚げ焼きにする。"}]},{"id":"tori-6","title":"丸ごと焼く場合","time":null,"badges":[],"tags":[],"blocks":[{"t":"p","text":"厚い部分に切り込みを入れて開き、厚さ2cm程度に揃える。塩・砂糖各小さじ1/2をすり込む。中火で片面4分焼き、裏返して酒大さじ2を振り、蓋をして弱火8分。火を止めて蓋のまま10分置く。"}]},{"id":"tori-7","title":"下味冷凍","time":null,"badges":[],"tags":["鶏むね"],"blocks":[{"t":"p","text":"そぎ切りと調味料をジッパー袋に入れて揉み、空気を抜いて冷凍。1ヶ月。分量はむね肉1枚あたり。"},{"t":"table","head":["味","調味料"],"rows":[["照り焼き","醤油・みりん・酒・砂糖 各大さじ1"],["味噌漬け","味噌大さじ1.5・みりん大さじ1・砂糖小さじ1"],["オイスター","オイスターソース大さじ1・酒大さじ1・にんにく少々"]]}]}]},{"id":"nasu","name":"茄子","short":"茄子","reference":false,"intro":[{"t":"p","text":"ピーマンの代わりに使える。淡色野菜なので緑黄色野菜の枠には入らない（その枠はにんじん・冷凍ほうれん草・冷凍ブロッコリー・トマト缶で確保する）。"},{"t":"ul","items":["日持ちは野菜室で5日〜1週間。低温に弱く、冷えすぎる場所では傷む。まとめ買いせず、使う週にまいばすけっとで買う。","油を吸うので、先にボウルで油をまぶしてから炒める。レンジで2分加熱してから炒めればさらに油を減らせる。","水にさらす必要はない。切ったらすぐ調理する。"]}],"recipes":[{"id":"nasu-1","title":"茄子と豚こまの味噌炒め","time":null,"badges":[],"tags":["豚こま","茄子"],"blocks":[{"t":"p","text":"茄子2本を乱切りにし、油大さじ1をまぶして中火で4分炒める。豚こま100gを加えて炒め、味噌大さじ1・みりん大さじ1・砂糖小さじ1・醤油小さじ1を混ぜたものを絡める。"}]},{"id":"nasu-2","title":"茄子の煮浸し","time":null,"badges":["レンジ","常備菜"],"tags":["茄子"],"blocks":[{"t":"p","text":"茄子2本を縦半分に切って皮に切れ目を入れ、耐熱容器にめんつゆ大さじ2・水100mlと入れ、ラップをしてレンジ5分。冷めると味が染みる。冷蔵3日。"}]}]},{"id":"sakana","name":"魚","short":"魚","reference":false,"intro":[{"t":"p","text":"生の魚は買わない。缶詰と冷凍する切り身の二本立てにし、夕食の週2〜3回を魚にする（切り身を焼く日が週1〜2回、缶詰の日が週1回）。"}],"recipes":[{"id":"sakana-1","title":"缶詰","time":null,"badges":[],"tags":["サバ缶","鮭","うどん","パスタ"],"blocks":[{"t":"ul","items":["サバ水煮缶：味噌煮（白米のおかず3番）、トマトパスタ、味噌汁、うどん","サバ味噌煮缶：温めて白米に乗せるだけ。調理しない日用","鮭の中骨水煮缶：味噌汁、炊き込みご飯","いわしの缶詰（醤油煮・蒲焼）：そのままおかず"]}]},{"id":"sakana-2","title":"冷凍する切り身","time":null,"badges":[],"tags":["鮭"],"blocks":[{"t":"p","text":"塩鮭（甘口）と塩サバ。味付け不要で、焼くだけでおかずになる。届いた日に1切れずつラップで包み、ジッパー袋に入れて冷凍。3週間。"},{"t":"p","text":"肉より高い（塩鮭は1切れ150〜200円程度の概算）。塩分が多いので甘口を選び、その日の味噌汁は味噌を少し減らす。"}]},{"id":"sakana-3","title":"切り身のフライパン焼き","time":null,"badges":[],"tags":[],"blocks":[{"t":"p","text":"フライパンにクッキングシートを敷く（油不要、皮がくっつかず、匂いが残らない）。前夜に冷蔵庫で解凍した切り身を皮を下にして置き、弱めの中火で4分、裏返して3分。凍ったまま焼くなら蓋をして各面プラス2分。身が白く不透明になり、箸で押してほぐれれば焼き上がり。"}]},{"id":"sakana-4","title":"鮭のちゃんちゃん焼き風","time":null,"badges":[],"tags":["豚こま","鮭","にんじん","玉ねぎ","長ねぎ"],"blocks":[{"t":"p","text":"豚こまの蒸し煮と同じ手順。玉ねぎとにんじんを敷いて鮭を乗せ、味噌大さじ1・みりん大さじ1・酒大さじ1を回しかけ、蓋をして8分。"}]}]},{"id":"pasta","name":"パスタ","short":"パスタ","reference":false,"intro":[],"recipes":[{"id":"pasta-1","title":"ツナとほうれん草のペペロンチーノ","time":null,"badges":[],"tags":["ツナ","ほうれん草","パスタ"],"blocks":[{"t":"p","text":"今できるペペロンチーノに、にんにくを炒める段階でツナ缶（油ごと）を、茹で上がり直前に冷凍ほうれん草を加えるだけ。塩気はツナの油とパスタの茹で汁で調整する。"}]},{"id":"pasta-2","title":"サバ缶トマトパスタ","time":null,"badges":[],"tags":["サバ缶","玉ねぎ","長ねぎ","トマト缶","パスタ"],"blocks":[{"t":"p","text":"にんにくを炒め、玉ねぎ薄切りを2分、トマト缶1/2とサバ水煮缶を汁ごと加えて7分煮詰める。塩で味を決め、茹でたパスタと和える。"},{"t":"p","text":"トマト缶はβカロテンとリコピンが取れて常温で1年以上もつ。開封後は余りをジップ袋で冷凍する。"}]},{"id":"pasta-3","title":"にんじんとツナの和風バターパスタ","time":null,"badges":[],"tags":["ツナ","にんじん","長ねぎ","パスタ"],"blocks":[{"t":"p","text":"にんじん1/2本を細切りにしてバター10gで3分炒め、ツナ缶とめんつゆ大さじ1を加える。茹でたパスタと茹で汁大さじ2で和える。仕上げに長ねぎ。"}]},{"id":"pasta-4","title":"茄子とツナのトマトパスタ","time":null,"badges":[],"tags":["ツナ","サバ缶","玉ねぎ","長ねぎ","茄子","トマト缶","パスタ"],"blocks":[{"t":"p","text":"サバ缶トマトパスタのサバをツナ缶に替え、油をまぶした茄子1本を玉ねぎと一緒に炒めてからトマト缶を加える。"}]},{"id":"pasta-5","title":"鮭とほうれん草のパスタ","time":null,"badges":[],"tags":["鮭","ほうれん草","パスタ"],"blocks":[{"t":"p","text":"焼いた塩鮭1切れをほぐし、ペペロンチーノに冷凍ほうれん草と一緒に加える。鮭の塩気があるので塩は控える。"}]},{"id":"pasta-6","title":"シーフードとパスタキューブのワンパンパスタ","time":null,"badges":["フライパン1つ"],"tags":["シーフード","ほうれん草","ブロッコリー","パスタ"],"blocks":[{"t":"p","text":"材料（1人分）：パスタ100g、水300ml、シーフードミックス80〜100g（300gの袋なら1/3）、パスタキューブ1個、冷凍ほうれん草か冷凍ブロッコリーひとつかみ、にんにくチューブ少々、オリーブ油少々。キューブの味や使い方はパッケージの表示を優先する。"},{"t":"ol","items":["シーフードミックスは凍ったまま、水200mlに塩小さじ1を溶かした塩水に入れて10分置く。ざるに上げ、キッチンペーパーで水気をしっかり拭く。","フライパンに油とにんにくを入れて弱火で温める。シーフードを入れて中火で1分炒め、色が変わったら皿に取り出す。","同じフライパンに水を入れて沸かす。塩は入れない（キューブに塩気がある）。","パスタを入れる。入りきらなければ半分に折る。中火で、ときどき混ぜながら表示時間どおり煮る。","残り1〜2分で水がほぼなくなったら、キューブ・冷凍野菜・取り出したシーフードを入れ、キューブを溶かしながら全体を絡める。"]},{"t":"p","text":"パスタが硬いのに水がなくなったら水を大さじ3ずつ足す。茹で上がっても水が多ければ強火で30秒飛ばす。塩水で戻すとうま味が流れにくく生臭さも出にくい。凍ったまま炒めると水が出てソースが薄まる。シーフードは火を通しすぎると縮んで硬くなるので、一度取り出して最後に戻す。"},{"t":"p","text":"残りのシーフードミックスは、使う分だけ素早く出し、袋の空気を抜いて口を折りクリップで留め、ジッパー袋に入れてすぐ冷凍庫へ戻す。開封後は2〜3週間で使い切る。解凍した分は再冷凍しないので、解凍は使う分だけにする。袋の中で固まっていたら袋の上から軽く叩いてほぐす。"}]}]},{"id":"udon","name":"うどん（冷凍うどん）","short":"うどん","reference":false,"intro":[],"recipes":[{"id":"udon-1","title":"豚ねぎうどん","time":null,"badges":[],"tags":["豚こま","にんじん","長ねぎ","うどん"],"blocks":[{"t":"p","text":"水300ml・めんつゆ（3倍濃縮）大さじ2を沸かし、豚こま80gとにんじん薄切りを入れて3分。冷凍うどんを加えて指定時間茹で、長ねぎを散らす。"}]},{"id":"udon-2","title":"ツナとほうれん草のバターめんつゆうどん","time":null,"badges":[],"tags":["ツナ","ほうれん草","うどん"],"blocks":[{"t":"p","text":"冷凍うどんをレンジで解凍。フライパンでツナ缶・冷凍ほうれん草・バター10g・めんつゆ大さじ1と炒め合わせる。汁なしタイプ。"}]},{"id":"udon-3","title":"味噌煮込みうどん風","time":null,"badges":[],"tags":["豚こま","にんじん","長ねぎ","油揚げ","うどん"],"blocks":[{"t":"p","text":"水300ml・味噌大さじ1・みりん大さじ1を沸かし、にんじん・油揚げ・長ねぎ・豚こまを入れて5分。冷凍うどんを加えて煮る。"},{"t":"p","text":"味噌汁の具材構成をそのまま主食に転用したもの。鍋1つで完結する。"}]},{"id":"udon-4","title":"鶏むねの味噌煮込みうどん","time":null,"badges":[],"tags":["豚こま","鶏むね","にんじん","長ねぎ","油揚げ","うどん"],"blocks":[{"t":"p","text":"材料：冷凍鶏むね肉120g（下味なし）、片栗粉小さじ2、にんじん1/3本、油揚げ1/2枚、冷凍長ねぎ大さじ2、冷凍うどん1玉、水300ml、味噌大さじ1、みりん大さじ1、顆粒だし小さじ1/3。"},{"t":"ol","items":["むね肉を半解凍にする（半解凍が一番切りやすい）。1cm厚のそぎ切りからさらに1cm幅の棒状に切り、片栗粉をまぶす。","水・みりん・顆粒だしを沸かし、薄い半月切りのにんじんと細切りの油揚げを入れ、蓋をして5分。","蓋を取り、鶏肉をほぐしながら入れて2〜3分。アクをすくう。","火を弱めて味噌を溶く。以後は煮立てない。","冷凍うどんを入れてパッケージの表示時間（手持ちのものは1分）。","火を止めて冷凍長ねぎを散らす。"]},{"t":"p","text":"豚こまと違い、鶏むねは長く煮るとパサつくので最後に入れる。蓋をせずに煮るとつゆが蒸発する。200ml以下に減ったら味噌を入れる前に水を50〜100ml足す。"}]},{"id":"udon-5","title":"サバ缶うどん","time":null,"badges":[],"tags":["サバ缶","長ねぎ","うどん"],"blocks":[{"t":"p","text":"水300ml・めんつゆ大さじ2のつゆにサバ水煮缶を汁ごと入れて温め、冷凍うどんを加える。長ねぎを散らす。"}]},{"id":"udon-6","title":"冷凍の豚こまで作るとき","time":null,"badges":[],"tags":["豚こま","うどん"],"blocks":[{"t":"p","text":"ラップのままジッパー袋に入れて流水に5分当て、その間に野菜とつゆを準備する。凍ったまま入れる場合は、表面が白くなってから箸で崩してほぐし、3分ほど長く煮る。塊のままだと中心に火が通らない。うどんは肉に火が通ってから入れる。"}]}]},{"id":"nabe","name":"一人鍋","short":"鍋","reference":false,"intro":[{"t":"p","text":"寒い時期用。核となる8食材と補助食材（豆腐・油揚げ）、それにシーフードミックスの残りで作れるので、買い足しは要らない。小さめの鍋か、蓋つきの深めのフライパンで1人分を作る。"},{"t":"ul","items":["固い具（にんじん・玉ねぎ）を先に煮て、肉・魚・葉物は後から入れる。","鶏むねとシーフードは煮すぎると硬くなるので最後に入れる。","味噌は火を弱めてから溶く。沸騰させると香りが飛ぶ。","白菜かもやしがあれば足すと、かさが増える（まいばすけっとで買える）。なくても成立する。"]}],"recipes":[{"id":"nabe-1","title":"豚こまとほうれん草の常夜鍋","time":"15分","badges":[],"tags":["豚こま","長ねぎ","ほうれん草","豆腐"],"blocks":[{"t":"p","text":"材料：豚こま100g、冷凍ほうれん草ひとつかみ多め、絹ごし豆腐1個、長ねぎ大さじ2、水400ml、酒大さじ2、顆粒だし小さじ1/2。つけだれ：めんつゆ大さじ1、酢大さじ1、水大さじ1（ポン酢の代わり）。"},{"t":"ol","items":["つけだれを小皿に混ぜておく。","鍋に水・酒・顆粒だしを入れて沸かし、豆腐をスプーンで大きくすくって入れて2分煮る。","弱めの中火にして、豚こまを1枚ずつ広げて入れる。色が変わってから1分で食べ頃。","冷凍ほうれん草を凍ったまま入れて1分。長ねぎを散らし、つけだれにつけて食べる。"]},{"t":"p","text":"豚とほうれん草が主役の鍋で、毎晩食べても飽きないことからこの名がある。豚は沸騰させ続けると硬くなるので、弱めの火でしゃぶしゃぶするように煮る。"}]},{"id":"nabe-2","title":"鶏むねの塩にんにく鍋","time":"20分","badges":[],"tags":["鶏むね","にんじん","玉ねぎ","長ねぎ","豆腐","油揚げ"],"blocks":[{"t":"p","text":"材料：鶏むね1/2枚（約130g）、片栗粉小さじ2、にんじん1/3本、玉ねぎ1/4個、絹ごし豆腐1個、油揚げ1/2枚、長ねぎ大さじ3、水400ml、酒大さじ1、顆粒だし小さじ1、塩小さじ1/3、にんにくチューブ少々、ごま油小さじ1。"},{"t":"ol","items":["鍋に水・酒・顆粒だしを入れ、薄い半月切りのにんじんとくし切りの玉ねぎを入れて、蓋をして5分煮る。","その間に鶏むねを1cm厚のそぎ切りにし、片栗粉をまぶす。","豆腐と細切りの油揚げを入れ、続けて鶏肉を1枚ずつ入れる。弱めの中火で3分煮る。","一番厚い鶏肉を切って中まで白いか確かめる。塩とにんにくで味を決め、長ねぎとごま油を加える。"]},{"t":"p","text":"片栗粉が鶏むねのパサつきを防ぎ、汁にも軽いとろみがついて冷めにくくなる。塩は少しずつ足して味見する。"}]},{"id":"nabe-3","title":"シーフードのトマト鍋","time":"15分","badges":[],"tags":["シーフード","にんじん","玉ねぎ","長ねぎ","ブロッコリー","トマト缶"],"blocks":[{"t":"p","text":"材料：シーフードミックス100g、トマト缶1/2缶、水200ml、玉ねぎ1/4個、にんじん1/3本、冷凍ブロッコリー5〜6房、顆粒だし小さじ1/2、砂糖ひとつまみ、にんにくチューブ少々、オリーブ油小さじ1、塩少々。"},{"t":"ol","items":["シーフードミックスは塩水（水200mlに塩小さじ1）に凍ったまま入れて10分置き、水気を拭く。","鍋に油とにんにくを入れて弱火で温め、薄切りの玉ねぎと薄い半月切りのにんじんを中火で2分炒める。","トマト缶・水・顆粒だし・砂糖を加え、蓋をして5分煮る。","冷凍ブロッコリーを凍ったまま入れて2分。最後にシーフードを入れて1〜2分煮て、塩で味を決める。"]},{"t":"p","text":"開封済みのシーフードミックスとトマト缶の残りを片付けられる。砂糖はトマトの酸味を丸めるため。残ったトマト缶はジッパー袋で冷凍する。"}]},{"id":"nabe-4","title":"サバ缶とねぎの味噌鍋","time":"10分","badges":[],"tags":["サバ缶","にんじん","長ねぎ","ほうれん草","豆腐","油揚げ"],"blocks":[{"t":"p","text":"材料：サバ水煮缶1缶、絹ごし豆腐1個、にんじん1/3本、油揚げ1/2枚、冷凍ほうれん草ひとつかみ、長ねぎ大さじ3、水300ml、味噌大さじ1.5、みりん大さじ1。"},{"t":"ol","items":["鍋に水と薄い半月切りのにんじん、細切りの油揚げを入れて、蓋をして5分煮る。","豆腐とサバ缶を汁ごと入れて3分煮る。","冷凍ほうれん草と長ねぎを入れて1分。","火を弱めてみりんを加え、味噌を溶く。"]},{"t":"p","text":"サバ缶の汁がだしになるので顆粒だしは要らない。サバ味噌煮（白米のおかず3番）を汁物に広げた形。"}]},{"id":"nabe-5","title":"シメ","time":null,"badges":["うどん","雑炊"],"tags":["長ねぎ","うどん"],"blocks":[{"t":"ul","items":["うどん：残った汁に冷凍うどん1玉を入れ、パッケージの表示時間煮る。汁が少なければ水100mlと、めんつゆ小さじ1（味噌鍋なら味噌少々）を足す。トマト鍋にも合う。","雑炊：ごはん茶碗1杯をざるに入れて水でさっと洗い、ぬめりを取る。残った汁に入れて3分煮て、長ねぎを散らす。卵なしでも成立する。"]}]}]},{"id":"miso","name":"味噌汁の具ローテーション","short":"味噌汁","reference":false,"intro":[{"t":"p","text":"わかめ一択から抜けるための7パターン。だしはだしの素かめんつゆで十分。"},{"t":"p","text":"茹で鶏の茹で汁があれば、だしの代わりに使う。"},{"t":"p","text":"コツは、固い根菜を先に煮て、葉物・ねぎ・わかめは火を止める直前に入れること。味噌は沸騰させると香りが飛ぶので、火を弱めてから溶く。"}],"recipes":[{"id":"miso-1","title":"豆腐 + わかめ","time":null,"badges":[],"tags":["豆腐","わかめ"],"blocks":[]},{"id":"miso-2","title":"長ねぎ + わかめ","time":null,"badges":[],"tags":["長ねぎ","わかめ"],"blocks":[{"t":"p","text":"ねぎは冷凍のまま投入"}]},{"id":"miso-3","title":"にんじん + 油揚げ","time":null,"badges":[],"tags":["にんじん","油揚げ"],"blocks":[{"t":"p","text":"にんじんは薄い半月切りで5分煮る"}]},{"id":"miso-4","title":"冷凍ほうれん草 + 油揚げ","time":null,"badges":[],"tags":["ほうれん草","油揚げ"],"blocks":[{"t":"p","text":"ほうれん草は最後30秒"}]},{"id":"miso-5","title":"じゃがいも + 玉ねぎ","time":null,"badges":[],"tags":["玉ねぎ","長ねぎ","じゃがいも"],"blocks":[{"t":"p","text":"じゃがいもは薄切りで7分"}]},{"id":"miso-6","title":"豚汁","time":null,"badges":[],"tags":["豚こま","にんじん","玉ねぎ","長ねぎ"],"blocks":[{"t":"p","text":"豚こま50g + にんじん + 玉ねぎ + 長ねぎ、これ単体で主菜になる"}]},{"id":"miso-7","title":"サバ缶 + 長ねぎ","time":null,"badges":[],"tags":["サバ缶","長ねぎ"],"blocks":[{"t":"p","text":"缶汁も入れる。だし不要"}]},{"id":"miso-8","title":"茄子","time":null,"badges":[],"tags":["茄子"],"blocks":[{"t":"p","text":"薄い半月切りで3分"}]},{"id":"miso-9","title":"鮭 + にんじん + 玉ねぎ","time":null,"badges":[],"tags":["鮭","にんじん","玉ねぎ","長ねぎ"],"blocks":[{"t":"p","text":"塩鮭の切り身半分を一口大に切る。だし不要"}]}]},{"id":"hozon","name":"冷凍・解凍と保存期限","short":"保存","reference":true,"intro":[{"t":"p","text":"冷凍の原則は3つ。水気を拭く、薄く平らにする、空気を遮断する。袋には中身と日付を書く。"}],"recipes":[{"id":"hozon-1","title":"食材別の冷凍方法","time":null,"badges":[],"tags":["豚こま","鶏むね","長ねぎ","油揚げ"],"blocks":[{"t":"ul","items":["長ねぎ：洗って水気を完全に拭いてから小口切りにし、ジッパー袋に平らに入れて空気を抜く。凍ったまま加熱料理に入れる。生の薬味には向かない。","豚こま：100gずつ、厚さ1.5cm以下の板状にラップで包み、まとめてジッパー袋へ。金属トレーの上で凍らせる。","鶏むね：使う形（そぎ切り）に切ってから冷凍するか、下味冷凍にする。","魚の切り身：1切れずつラップで包んでジッパー袋へ。","油揚げ：使わない分をそのまま冷凍。"]}]},{"id":"hozon-2","title":"保存期限の目安","time":null,"badges":[],"tags":["豚こま","鶏むね","鮭","シーフード","長ねぎ","茄子"],"blocks":[{"t":"table","head":["食材","冷蔵","冷凍"],"rows":[["長ねぎ（丸ごと）","2週間","—"],["長ねぎ（小口切り）","3〜4日","1ヶ月"],["豚こま切れ","2日（消費期限に従う）","3週間"],["鶏むね肉","2日（消費期限に従う）","3〜4週間"],["鶏むね（下味冷凍）","—","1ヶ月"],["塩鮭・塩サバの切り身","消費期限に従う","3週間"],["シーフードミックス（開封後）","—","2〜3週間"],["茹で鶏","3日","3週間"],["茄子","5日〜1週間","—"]]},{"t":"p","text":"冷凍の期限は安全ではなく味の基準。長く置くものは冷凍庫の奥に入れる。一度解凍したものは再冷凍しない。"}]},{"id":"hozon-3","title":"解凍方法","time":null,"badges":[],"tags":["豚こま","鶏むね"],"blocks":[{"t":"table","head":["方法","所要時間","特徴"],"rows":[["冷蔵庫に移す","半日〜一晩","品質が最も良く、水道代もかからない。前日に献立を決められるならこれ"],["流水（袋のまま）","こま切れ5分、むね肉15〜20分","急ぐとき。鉛筆ほどの細い流れで足りる"],["溜め水","流水よりやや長い","5分ごとにかき混ぜ、10分で水を替える。使う水は2〜3リットル"],["レンジの解凍モード","数分","ムラが出る。半解凍で止めて切る使い方なら実用的"]]},{"t":"ul","items":["常温放置はしない。表面だけが長時間、細菌の増えやすい温度（10〜60度）に置かれる。","ぬるま湯は使わない。表面が煮えて硬くなり、細菌も増えやすい。","袋から出さない。水が直接触れると旨味が流れる。","汁物や蒸し煮なら、平たく凍らせた豚こまは凍ったまま入れられる（煮る時間を2〜3分足す）。"]}]}]}]};
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 分量・時間をマーカーで強調する(料理中に数字だけ目で拾えるように)
const QTY = /(大さじ|小さじ)\s?[\d.\/〜]+|[\d.\/]+(?:〜[\d.\/]+)?\s?(?:ml|g|kg|cm|mm|分|秒|本|個|枚|切れ|玉|合|リットル)|ひとつまみ|ひとつかみ|少々/g;
function inline(s){
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return h.replace(QTY, (m) => `<span class="q">${m}</span>`);
}
function blocks(bs){
  return bs.map((b, i) => {
    if (b.t === "p") return `<p>${inline(b.text)}</p>`;
    if (b.t === "ul") return `<ul>${b.items.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`;
    if (b.t === "ol") return `<ol>${b.items.map((x) => `<li>${inline(x)}</li>`).join("")}</ol>`;
    return `<div class="tablewrap"><table><thead><tr>${b.head.map((x) => `<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((x) => `<td>${inline(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }).join("");
}
const textOf = (r) => [r.title, ...r.badges, ...r.tags, ...r.blocks.map((b) => b.text || (b.items || []).join(" ") || [b.head, ...(b.rows || [])].flat().join(" "))].join(" ");

const state = { cat: DATA.categories[0].id, q: "", tags: new Set(), open: new Set() };
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };
const savedCat = store.get("jisui.cat");
if (savedCat && DATA.categories.some((c) => c.id === savedCat)) state.cat = savedCat;

// 直リンク: #gohan-2 のようなハッシュで該当レシピを開く
function fromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  const cat = DATA.categories.find((c) => c.recipes.some((r) => r.id === id));
  if (cat){ state.cat = cat.id; state.q = ""; state.tags.clear(); state.open.add(id); return id; }
  return null;
}

function renderTabs(){
  requestAnimationFrame(() => $('.tab[aria-selected="true"]')?.scrollIntoView({ inline: "nearest", block: "nearest" }));
  $("#tabs").innerHTML = DATA.categories.map((c) =>
    `<button class="tab${c.reference ? " ref" : ""}" role="tab" data-cat="${c.id}" aria-selected="${!searching() && c.id === state.cat}">${c.short}</button>`).join("");
}
const searching = () => state.q.trim() !== "" || state.tags.size > 0;

function card(r, catName){
  const open = state.open.has(r.id);
  return `<article class="card${open ? " open" : ""}" id="${r.id}">
    <button class="head" aria-expanded="${open}" aria-controls="b-${r.id}" data-id="${r.id}">
      <span class="title">${catName ? `<span class="cat">${esc(catName)}</span>` : ""}${esc(r.title)}</span>
      ${r.badges.map((b) => `<span class="badge">${esc(b)}</span>`).join("")}
      ${r.time ? `<span class="time">${r.time}</span>` : ""}
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="body" id="b-${r.id}">${r.blocks.length ? blocks(r.blocks) : '<p class="lead">手順の記載なし</p>'}</div>
  </article>`;
}

function render(){
  renderTabs();
  const main = $("#main");
  const tagBar = `<span class="tags-label">食材で絞る${state.tags.size ? `(${[...state.tags].join("・")})` : ""}</span><div class="tags" id="tagbar">${DATA.tags.map((t) =>
    `<button class="chip" data-tag="${t}" aria-pressed="${state.tags.has(t)}">${t}</button>`).join("")}</div>`;
  if (searching()){
    const words = state.q.trim().split(/\s+/).filter(Boolean);
    const hits = [];
    for (const c of DATA.categories){
      if (c.reference) continue;
      for (const r of c.recipes){
        const t = textOf(r);
        if (words.every((w) => t.includes(w)) && [...state.tags].every((g) => r.tags.includes(g))) hits.push(card(r, c.short));
      }
    }
    main.innerHTML = tagBar + (hits.length ? hits.join("") :
      `<p class="empty">該当するレシピがありません。<br>食材の絞り込みを減らすか、別の言葉で探してください。</p>`);
    return;
  }
  const c = DATA.categories.find((x) => x.id === state.cat);
  main.innerHTML = (c.reference ? "" : tagBar) +
    (c.intro.length ? `<div class="intro">${blocks(c.intro)}</div>` : "") +
    c.recipes.map((r) => card(r)).join("");
}

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat; state.q = ""; state.tags.clear(); $("#q").value = ""; $("#searchBox").classList.remove("has");
  store.set("jisui.cat", state.cat); history.replaceState(null, "", location.pathname);
  render(); window.scrollTo({ top: 0 });
  b.scrollIntoView({ inline: "nearest", block: "nearest" });
});
$("#main").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (chip){ const t = chip.dataset.tag, x = $("#tagbar").scrollLeft; state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); render(); $("#tagbar").scrollLeft = x; return; }
  const head = e.target.closest("button.head"); if (!head) return;
  const id = head.dataset.id, art = head.parentElement;
  const open = !state.open.has(id);
  open ? state.open.add(id) : state.open.delete(id);
  art.classList.toggle("open", open); head.setAttribute("aria-expanded", open);
  if (open) history.replaceState(null, "", "#" + id);
});
$("#q").addEventListener("input", (e) => {
  state.q = e.target.value; $("#searchBox").classList.toggle("has", state.q !== ""); render();
});
$("#clear").addEventListener("click", () => {
  $("#q").value = ""; state.q = ""; $("#searchBox").classList.remove("has"); render(); $("#q").focus();
});

// 調理中に画面が消えないようにする(Screen Wake Lock API。iOS 16.4以降)
let lock = null;
if ("wakeLock" in navigator){
  const btn = $("#wake"); btn.hidden = false;
  const set = (on) => { btn.setAttribute("aria-pressed", on); $("#wakeLabel").textContent = on ? "画面オン中" : "画面を消さない"; };
  const acquire = async () => { try { lock = await navigator.wakeLock.request("screen"); set(true); lock.addEventListener("release", () => { if (!want) set(false); }); } catch { set(false); } };
  let want = false;
  btn.addEventListener("click", async () => { want = !want; if (want) await acquire(); else { await lock?.release(); lock = null; set(false); } });
  document.addEventListener("visibilitychange", () => { if (want && document.visibilityState === "visible") acquire(); });
}

$("#foot").innerHTML = `元データ: Obsidian 自炊/レシピ帳.md(${DATA.source_updated} 更新)・生成 ${DATA.built}`;
const target = fromHash();
render();
if (target) requestAnimationFrame(() => document.getElementById(target)?.scrollIntoView({ block: "start" }));
window.addEventListener("hashchange", () => { const t = fromHash(); if (t){ render(); document.getElementById(t)?.scrollIntoView({ block: "start" }); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=5dba7749bd").catch(() => {});
</script>
</body>
</html>
